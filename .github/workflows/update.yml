name: Update Market Data

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    concurrency:
      group: market-update
      cancel-in-progress: false

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch and analyze market news
        run: node scripts/fetch-news.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "marketbuzz-bot"
          git config user.email "bot@marketbuzz.com"

          git add public/data/market.json

          if git diff --staged --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "auto: update market data $(date -u)"
            git push
          fi
